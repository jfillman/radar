# Two CRDs that share a plural with CloudNativePG.
#
# Radar's renderer dispatch, getResourceStatus and cell dispatch are all gated
# on an EXACT API group, with an explicit fall-through to the generic renderer.
# None of that can be verified with only CNPG installed: with one engine
# present, a guard that matches everything and a guard that matches the right
# thing behave identically. These make the difference observable.
#
#   clusters.apps.kubeblocks.io  — a third `clusters` engine. Must render the
#                                  GENERIC drawer: not blank (the plural is in
#                                  KNOWN_KINDS, which suppresses the generic
#                                  renderer without the fall-through), and not
#                                  a fabricated Postgres status.
#   backups.velero.io            — the shared `backups` plural. Velero and CNPG
#                                  must resolve to different column sets and
#                                  different status readers on one cluster.
#
# Both are trimmed to the fields Radar reads. Installing real KubeBlocks or a
# real Velero is not the point and costs minutes per run.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.apps.kubeblocks.io
spec:
  group: apps.kubeblocks.io
  scope: Namespaced
  names:
    plural: clusters
    singular: cluster
    kind: Cluster
    listKind: ClusterList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.velero.io
spec:
  group: velero.io
  scope: Namespaced
  names:
    plural: backups
    singular: backup
    kind: Backup
    listKind: BackupList
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
