# Credentials for the unreachable object store. The values are irrelevant —
# the endpoint never answers, which is the point. They exist because CNPG
# validates the secret reference before it will accept the barmanObjectStore
# block at all.
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-demo-object-store
  namespace: pg
type: Opaque
stringData:
  ACCESS_KEY_ID: radar-demo-not-a-real-key
  ACCESS_SECRET_KEY: radar-demo-not-a-real-secret
