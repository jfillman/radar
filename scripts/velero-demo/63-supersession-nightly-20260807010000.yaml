metadata:
  name: nightly-20260807010000
  namespace: velero
  labels:
    velero.io/schedule-name: nightly
spec:
  includedNamespaces:
    - "*"
  storageLocation: default
  ttl: 720h0m0s
status:
  completionTimestamp: "@now-3304m"
  phase: Completed
  startTimestamp: "@now-3310m"
